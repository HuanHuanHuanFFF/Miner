name: DEFLATE round 2

on:
  workflow_dispatch:
    inputs:
      allow_private:
        description: 'Explicitly authorize this manual run to consume private-repository Actions minutes'
        required: true
        type: boolean
        default: false
      reuse_verified_controls:
        description: 'Reuse hash-bound prior official gates for the three unchanged constant variants'
        required: true
        type: boolean
        default: false
      include_bucket2:
        description: 'Also diagnose experimental bucket2; a proof rejection is recorded separately from required controls'
        required: true
        type: boolean
        default: false
      run_benchmarks:
        description: 'Run the four-block performance experiment after required gates pass'
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: deflate-round2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.event_name == 'workflow_dispatch' && (github.event.repository.private == false || inputs.allow_private == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check CI gate policy and diagnostics
        run: |
          python3 scripts/test-round2-ci.py
          bash -n scripts/ci-round2.sh
      - name: Prepare isolated runner and pinned source
        run: bash scripts/ci-prepare.sh
      - name: Install official verification toolchain
        run: bash scripts/ci-setup.sh
      - name: Check bucket equivalence and second-probe attribution
        if: inputs.include_bucket2 == true
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/research-round2.py
      - name: Verify required candidates and optional bucket2 with the official gate
        env:
          REUSE_VERIFIED_CONTROLS: ${{ inputs.reuse_verified_controls }}
          INCLUDE_BUCKET2: ${{ inputs.include_bucket2 }}
        run: bash scripts/ci-round2.sh
      - name: Require every maintained candidate gate to accept
        run: |
          "$DEFLATE_ROOT/.venv/bin/python" scripts/check-round2-gates.py "$RUNNER_TEMP/deflate-reports"
      - name: Measure accepted candidates in four interleaved blocks
        if: inputs.run_benchmarks == true
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          export PYTHONPATH="$DEFLATE_ROOT/validator"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/round2.py
      - name: Record experimental evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## DEFLATE round 2'
            echo "Result: $JOB_STATUS"
            echo 'Required gates: probe3, probe2-nice16, probe2-nice64. bucket2 is opt-in and experimental.'
            echo 'Public stage1 and finite synthetic inputs only; no submission or reward prediction.'
            for report in research.json comparison.json bucket2-gate.json probe3-gate.json probe2-nice16-gate.json probe2-nice64-gate.json; do
              if [ -f "$RUNNER_TEMP/deflate-reports/$report" ]; then
                echo "### $report"
                echo '```json'
                cat "$RUNNER_TEMP/deflate-reports/$report"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
