name: DEFLATE baseline

defaults:
  run:
    working-directory: competitions/deflate
env:
  DEFLATE_WORKSPACE: ${{ github.workspace }}/competitions/deflate

on:
  workflow_dispatch:
    inputs:
      competition:
        description: 'Track for this manual validation; FloatLib bridge works before its dedicated workflow reaches main'
        required: true
        type: choice
        options: [deflate, floatlib]
        default: deflate
      candidates:
        description: 'FloatLib frozen f01-* directories, comma separated; ignored for DEFLATE'
        required: true
        type: string
        default: baseline
      seed:
        description: 'FloatLib benchmark seed; ignored for DEFLATE'
        required: true
        type: string
        default: '42'
      allow_private:
        description: 'Authorize standard private-repository Actions minutes for this manual run'
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: deflate-baseline-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  baseline:
    # Public standard runners are free; do not silently run against private billing.
    if: github.event_name == 'workflow_dispatch' && inputs.competition != 'floatlib' && (github.event.repository.private == false || inputs.allow_private == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated runner and pinned source
        run: bash scripts/ci-prepare.sh
      - name: Install official verification toolchain
        run: bash scripts/ci-setup.sh
      - name: Verify original template and public corpus
        run: bash scripts/ci-baseline.sh
      - name: Record result summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## DEFLATE baseline'
            echo "Result: $JOB_STATUS"
            echo 'Official source: a356bbff18b60c4527fbcc85d5a28ef9c20214e0'
            echo 'Input: unmodified miner/template; public corpus-stage1 only.'
            echo 'CI timing is host-specific evidence, not an official competition score.'
            if [ -f "$RUNNER_TEMP/deflate-reports/provenance.txt" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/deflate-reports/provenance.txt"
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/deflate-reports/baseline.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/deflate-reports/baseline.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          df -h /

  floatlib:
    defaults:
      run:
        working-directory: .
    if: github.event_name == 'workflow_dispatch' && inputs.competition == 'floatlib' && inputs.candidates != '__torchlean_readonly_profile__' && inputs.candidates != '__torchlean_r25__' && (github.event.repository.private == false || inputs.allow_private == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLOATLIB_CANDIDATES: ${{ inputs.candidates }}
      FLOATLIB_SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: competitions/floatlib
      - name: Prepare exact source and capped sandbox
        run: bash competitions/floatlib/scripts/ci-prepare.sh
      - name: Restore pinned toolchain and dependency cache
        id: toolchain
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/floatlib-upstream/lean/.lake
          key: floatlib-${{ runner.os }}-978cc5b445edb9943fd9953b0a9037d97a9f33a8
      - name: Install official environment
        run: bash competitions/floatlib/scripts/ci-setup.sh
      - name: Save successfully prepared pinned dependencies
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/floatlib-upstream/lean/.lake
          key: floatlib-${{ runner.os }}-978cc5b445edb9943fd9953b0a9037d97a9f33a8
      - name: Run exact full gate and original paired benchmark
        run: bash competitions/floatlib/scripts/ci-validate.sh
      - name: Preserve source and original receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floatlib-${{ github.run_id }}-receipts
          path: ${{ runner.temp }}/floatlib-reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  readonly_reference:
    # Research observation of immutable upstream references, never a new entry.
    defaults:
      run:
        working-directory: .
    if: github.event_name == 'workflow_dispatch' && inputs.competition == 'floatlib' && inputs.candidates == '__torchlean_readonly_profile__' && github.event.repository.private == false && inputs.allow_private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject late queue acquisition before toolchain work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, json, os
          end=datetime.datetime(2026,10,29,3,38,56,tzinfo=datetime.timezone.utc)
          if (end-datetime.datetime.now(datetime.timezone.utc)).total_seconds()<600:
              out=Path(os.environ['RUNNER_TEMP'])/'r24-reference-profile-reports'
              out.mkdir(parents=True,exist_ok=True)
              (out/'summary.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'complete':False,'state':'NOT_STARTED_WINDOW_CLOSED_OR_INSUFFICIENT_AFTER_QUEUE'})+'\n')
              raise SystemExit(1)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: competitions/floatlib
      - name: Prepare isolated research runner
        run: bash competitions/floatlib/scripts/ci-prepare.sh
      - name: Restore existing pinned dependency cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/floatlib-upstream/lean/.lake
          key: floatlib-${{ runner.os }}-978cc5b445edb9943fd9953b0a9037d97a9f33a8
      - name: Observe immutable public reference profiles
        run: python3 competitions/floatlib/candidates/f01-d7-research/round7h-20261028T203856Z/readonly-reference-profile.py
      - name: Preserve original observation receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floatlib-${{ github.run_id }}-receipts
          path: ${{ runner.temp }}/r24-reference-profile-reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  torchlean_r25:
    defaults:
      run:
        working-directory: .
    if: github.event_name == 'workflow_dispatch' && inputs.competition == 'floatlib' && inputs.candidates == '__torchlean_r25__' && github.event.repository.private == false && inputs.allow_private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: competitions/torchlean
      - name: Prepare immutable TorchLean source and capped public runner
        run: bash competitions/torchlean/scripts/ci-prepare.sh
      - name: Restore pinned dependency cache
        id: tlcache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/floatlib-upstream/lean/.lake
          key: torchlean-${{ runner.os }}-accb82b6e2adeda1b41a57a260d68fb3879c427e
          restore-keys: |
            floatlib-${{ runner.os }}-978cc5b445edb9943fd9953b0a9037d97a9f33a8
      - name: Original twelve-kernel proof and overall paired experiment
        run: python3 competitions/torchlean/scripts/ci-r25.py
      - name: Check original setup completion
        if: always()
        id: setupready
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          p=Path(os.environ['RUNNER_TEMP'])/'torchlean-reports/summary.json'
          d=json.loads(p.read_text()) if p.is_file() else {}
          ok=all(any(c['label']==n and c['exit_code']==0 for c in d.get('commands',[])) for n in ['setup','setup-check'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(ok).lower()+'\n')
          PY
      - name: Save successfully prepared pinned dependencies
        if: always() && steps.setupready.outputs.ready == 'true' && steps.tlcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/floatlib-upstream/lean/.lake
          key: torchlean-${{ runner.os }}-accb82b6e2adeda1b41a57a260d68fb3879c427e
      - name: Preserve original proof and measurement records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: torchlean-${{ github.run_id }}-receipts
          path: ${{ runner.temp }}/torchlean-reports/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
