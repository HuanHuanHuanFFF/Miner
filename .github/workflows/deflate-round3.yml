name: DEFLATE round 3

on:
  workflow_dispatch:
    inputs:
      allow_private:
        description: 'Authorize standard private-repository Actions minutes'
        required: true
        type: boolean
        default: false
      batch:
        description: 'Tracked experiment specification within evidence/round3'
        required: true
        type: choice
        options: [batch-a, batch-b, batch-c, batch-d]
        default: batch-a
permissions:
  contents: read

concurrency:
  group: deflate-round3-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.event_name == 'workflow_dispatch' && (github.event.repository.private == false || inputs.allow_private == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated runner and pinned source
        run: bash scripts/ci-prepare.sh
      - name: Install official verification toolchain
        run: bash scripts/ci-setup.sh
      - name: Screen, refine and verify selected candidates
        env:
          ROUND3_BATCH: ${{ inputs.batch || 'batch-a' }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          export PYTHONPATH="$DEFLATE_ROOT/validator"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/round3.py
      - name: Record experiment outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "DEFLATE round3: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Public screening and selected full gates only; calibrated frontier geometry is conditional.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/deflate-reports/round3-summary.json" ]; then
            cat "$RUNNER_TEMP/deflate-reports/round3-summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
