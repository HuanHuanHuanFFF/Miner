name: DEFLATE round 5
on:
  workflow_dispatch:
    inputs:
      specification:
        description: 'Optional single batch; empty runs both H16 gates'
        required: false
        type: string
        default: ''
      allow_private:
        description: 'Authorize standard private-repository Actions minutes'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deflate-round5-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  experiment:
    if: github.event_name == 'workflow_dispatch' && (github.event.repository.private == false || inputs.allow_private == true)
    strategy:
      fail-fast: false
      matrix:
        specification: ${{ fromJSON(inputs.specification && format('["{0}"]', inputs.specification) || '["h16-small-gate","h16-smallc-gate"]') }}
    name: ${{ matrix.specification }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROUND4_SPEC: ${{ matrix.specification }}
      ROUND4_SPEC_DIR: evidence/round5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate batch and exact candidate bytes
        run: python3 scripts/round4.py preflight
      - name: Prepare isolated runner and pinned source
        run: bash scripts/ci-prepare.sh
      - name: Install official verification toolchain
        run: bash scripts/ci-setup.sh
      - name: Check finite CPU candidate equivalence
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/research-round4.py
      - name: Extract research candidates and compare token cost without proof claims
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/research-round5.py
      - name: Publish early extraction diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-${{ github.run_id }}-${{ matrix.specification }}-extraction
          path: ${{ runner.temp }}/round4-receipts/research5/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
      - name: Inspect token and coding-block costs without timing instrumentation
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/profile-round4-tokens.py
      - name: Screen time and compression axes
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          export PYTHONPATH="$DEFLATE_ROOT/validator"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/round4.py screen
      - name: Publish early research receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-${{ github.run_id }}-${{ matrix.specification }}-screen
          path: ${{ runner.temp }}/round4-receipts/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
      - name: Refine shortlisted candidates
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          export PYTHONPATH="$DEFLATE_ROOT/validator"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/round4.py refine
      - name: Optional same-process relative timing diagnostic
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          export PYTHONPATH="$DEFLATE_ROOT/validator"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/interleaved-round4.py
      - name: Publish refined receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-${{ github.run_id }}-${{ matrix.specification }}-refine
          path: ${{ runner.temp }}/round4-receipts/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
      - name: Run selected fresh official gate
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$ELAN_HOME/bin:$PATH"
          export PYTHONPATH="$DEFLATE_ROOT/validator"
          "$DEFLATE_ROOT/.venv/bin/python" scripts/round4.py gate
      - name: Publish final evidence without toolchains or binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r5-${{ github.run_id }}-${{ matrix.specification }}-gate
          path: ${{ runner.temp }}/round4-receipts/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore
